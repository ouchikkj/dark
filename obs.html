<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK // OBS OVERLAY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Share+Tech+Mono&display=swap');
        :root {
            --main: #e8e8e8;
            --dim: #777777;
            --accent: #ffffff;
            --alert: #ff2929;
            --gold: #ffcc33;
            --panel: rgba(5, 5, 5, 0.92);
            --line: rgba(255, 255, 255, 0.2);
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
        body { font-family: 'Share Tech Mono', monospace; color: var(--main); }
        body.theme-architect { --main:#69f0ae; --dim:#4caf50; --accent:#69f0ae; --alert:#ff5252; --gold:#b2ff59; --panel:rgba(2,8,2,.93); --line:rgba(105,240,174,.3); }
        body.theme-light { --main:#111; --dim:#555; --accent:#222; --alert:#d32f2f; --gold:#e65100; --panel:rgba(245,245,245,.94); --line:rgba(0,0,0,.25); }
        body.theme-ambar { --main:#ffb000; --dim:#b37700; --accent:#ffcc00; --alert:#ff3300; --gold:#ffe066; --panel:rgba(10,5,0,.94); --line:rgba(255,176,0,.3); }
        body.theme-ordem { --main:#f0f0f0; --dim:#8d8d8d; --accent:#e60000; --alert:#ff1a1a; --gold:#ffffff; --panel:rgba(0,0,0,.95); --line:rgba(230,0,0,.45); }
        body.theme-contencao { --main:#b3e6ff; --dim:#5c99cc; --accent:#80d4ff; --alert:#d90011; --gold:#00ccff; --panel:rgba(2,6,15,.95); --line:rgba(128,212,255,.35); }
        body.theme-neon { --main:#00ffff; --dim:#008888; --accent:#ff00ff; --alert:#ff0055; --gold:#ffff00; --panel:rgba(5,5,16,.94); --line:rgba(255,0,255,.4); }
        body.theme-combat { --main:#ffffff; --dim:#cc7777; --accent:#ff2020; --alert:#ff2020; --gold:#ffffff; --panel:rgba(10,0,0,.95); --line:rgba(255,0,0,.45); }

        .persistent-hud {
            position: fixed; top: 4vh; left: 3vw; width: min(470px, 46vw); min-width: 330px;
            background: linear-gradient(110deg, var(--panel), rgba(0,0,0,.48));
            border: 1px solid var(--line); border-left: 4px solid var(--accent);
            padding: 16px 18px; box-shadow: 0 14px 38px rgba(0,0,0,.62);
            opacity: 0; transform: translateX(-20px); transition: opacity .35s, transform .35s;
            pointer-events: none;
        }
        .persistent-hud.visible { opacity: 1; transform: translateX(0); }
        .hud-layout { display: flex; align-items: stretch; gap: 14px; }
        .hud-portrait-frame { display: none; width: 88px; min-width: 88px; height: 88px; position: relative; overflow: hidden; align-self: flex-start; border: 1px solid var(--line); border-left: 3px solid var(--accent); background: rgba(0,0,0,.55); box-shadow: inset 0 0 18px rgba(0,0,0,.65); }
        .persistent-hud.has-portrait .hud-portrait-frame { display: block; }
        .hud-portrait { width: 100%; height: 100%; object-fit: cover; display: block; filter: contrast(1.04) saturate(.92); }
        .hud-info { flex: 1; min-width: 0; }
        .hud-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 9px; margin-bottom: 11px; }
        .hud-character { font-family:'Oswald',sans-serif; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; color: var(--main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hud-afi { color: var(--dim); font-size: 12px; letter-spacing: 2px; white-space: nowrap; }
        .hud-stat { display: grid; grid-template-columns: 44px 1fr 82px; align-items: center; gap: 10px; margin: 8px 0; }
        .hud-stat-label { color: var(--dim); font-size: 12px; letter-spacing: 2px; }
        .hud-track { height: 9px; border: 1px solid var(--line); background: rgba(0,0,0,.55); overflow: hidden; }
        .hud-fill { height: 100%; width: 0; background: var(--accent); transition: width .45s ease; }
        .hud-stat.vd .hud-fill { background: var(--alert); }
        .hud-stat.san .hud-fill { background: var(--gold); }
        .hud-value { text-align: right; color: var(--main); font-size: 14px; letter-spacing: 1px; }
        .hud-conditions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; min-height: 0; }
        .hud-condition { border: 1px solid var(--line); color: var(--dim); padding: 4px 7px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
        @media (max-width:700px) { .persistent-hud { width: 90vw; min-width: 0; top: 2vh; left: 3vw; } .hud-portrait-frame { width: 76px; min-width: 76px; height: 76px; } }

        /* PRESETS DE LAYOUT: alteram apenas posição, proporção e organização. */
        body.layout-compact .persistent-hud { top: 2.5vh; left: 2vw; width: min(365px, 38vw); min-width: 285px; padding: 11px 13px; }
        body.layout-compact .hud-layout { gap: 10px; }
        body.layout-compact .hud-portrait-frame { width: 64px; min-width: 64px; height: 64px; }
        body.layout-compact .hud-header { padding-bottom: 5px; margin-bottom: 6px; }
        body.layout-compact .hud-character { font-size: 19px; }
        body.layout-compact .hud-afi, body.layout-compact .hud-stat-label { font-size: 10px; }
        body.layout-compact .hud-stat { grid-template-columns: 34px 1fr 63px; gap: 7px; margin: 5px 0; }
        body.layout-compact .hud-track { height: 7px; }
        body.layout-compact .hud-value { font-size: 11px; }
        body.layout-compact .hud-conditions { margin-top: 7px; gap: 4px; }
        body.layout-compact .hud-condition { padding: 2px 5px; font-size: 8px; }
        body.layout-compact #stage { justify-content: flex-end; padding: 0 3vw 4vh; }
        body.layout-compact .card { width: min(570px, 62vw); min-height: 150px; padding: 17px 21px; }
        body.layout-compact .title { font-size: 24px; }
        body.layout-compact .result { font-size: 52px; }

        body.layout-lowerthird .persistent-hud { top: auto; bottom: 3vh; left: 3vw; width: min(840px, 74vw); min-width: 560px; padding: 13px 17px; }
        body.layout-lowerthird .hud-layout { align-items: center; }
        body.layout-lowerthird .hud-portrait-frame { width: 92px; min-width: 92px; height: 92px; }
        body.layout-lowerthird .hud-info { display: grid; grid-template-columns: repeat(3, minmax(145px, 1fr)); gap: 5px 16px; }
        body.layout-lowerthird .hud-header { grid-column: 1 / -1; margin-bottom: 3px; padding-bottom: 6px; }
        body.layout-lowerthird .hud-stat { grid-template-columns: 34px 1fr 66px; gap: 7px; margin: 4px 0; }
        body.layout-lowerthird .hud-conditions { margin-top: 8px; }
        body.layout-lowerthird #stage { align-items: flex-start; padding: 5vh 5vw 0; }

        body.layout-sidebar .persistent-hud { top: 50%; left: 2vw; width: min(285px, 25vw); min-width: 235px; padding: 15px; transform: translate(-20px, -50%); }
        body.layout-sidebar .persistent-hud.visible { transform: translate(0, -50%); }
        body.layout-sidebar .hud-layout { flex-direction: column; align-items: center; gap: 12px; }
        body.layout-sidebar .hud-portrait-frame { width: 108px; min-width: 108px; height: 108px; align-self: center; }
        body.layout-sidebar .hud-info { width: 100%; }
        body.layout-sidebar .hud-header { flex-direction: column; align-items: center; gap: 3px; text-align: center; }
        body.layout-sidebar .hud-character { width: 100%; text-align: center; }
        body.layout-sidebar .hud-stat { grid-template-columns: 34px 1fr 62px; gap: 7px; }
        body.layout-sidebar .hud-conditions { justify-content: center; }

        body.layout-topbar .persistent-hud { top: 2vh; left: 50%; width: min(920px, 86vw); min-width: 610px; padding: 13px 18px; transform: translate(-50%, -20px); }
        body.layout-topbar .persistent-hud.visible { transform: translate(-50%, 0); }
        body.layout-topbar .hud-layout { align-items: center; }
        body.layout-topbar .hud-portrait-frame { width: 78px; min-width: 78px; height: 78px; }
        body.layout-topbar .hud-info { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 4px 18px; }
        body.layout-topbar .hud-header { grid-column: 1 / -1; margin-bottom: 2px; padding-bottom: 6px; }
        body.layout-topbar .hud-stat { grid-template-columns: 36px 1fr 70px; gap: 8px; margin: 3px 0; }
        body.layout-topbar .hud-conditions { justify-content: center; margin-top: 7px; }

        body.layout-mirrored .persistent-hud { left: auto; right: 3vw; border-left-width: 1px; border-right: 4px solid var(--accent); transform: translateX(20px); }
        body.layout-mirrored .persistent-hud.visible { transform: translateX(0); }
        body.layout-mirrored .hud-layout { flex-direction: row-reverse; }
        body.layout-mirrored .hud-portrait-frame { border-left-width: 1px; border-right: 3px solid var(--accent); }
        body.layout-mirrored #stage { justify-content: flex-start; padding-left: 4vw; padding-right: 5vw; }

        @media (max-width: 800px) {
            body.layout-lowerthird .persistent-hud, body.layout-topbar .persistent-hud { width: 94vw; min-width: 0; left: 3vw; right: auto; transform: translateY(-15px); }
            body.layout-lowerthird .persistent-hud.visible, body.layout-topbar .persistent-hud.visible { transform: translateY(0); }
            body.layout-lowerthird .hud-info, body.layout-topbar .hud-info { display: block; }
            body.layout-sidebar .persistent-hud { width: 90vw; min-width: 0; top: 2vh; left: 3vw; transform: translateY(-15px); }
            body.layout-sidebar .persistent-hud.visible { transform: translateY(0); }
            body.layout-sidebar .hud-layout { flex-direction: row; align-items: stretch; }
            body.layout-compact .persistent-hud { width: 90vw; min-width: 0; }
            body.layout-mirrored .persistent-hud { left: 3vw; right: auto; border-left: 4px solid var(--accent); border-right: 1px solid var(--line); }
            body.layout-mirrored .hud-layout { flex-direction: row; }
        }

        #stage { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 0 5vw 8vh; pointer-events: none; }
        .card {
            width: min(760px, 90vw); min-height: 190px; position: relative; overflow: hidden;
            background: linear-gradient(110deg, var(--panel), rgba(0,0,0,.55));
            border: 1px solid var(--line); border-left: 5px solid var(--accent);
            padding: 24px 30px 22px; box-shadow: 0 18px 55px rgba(0,0,0,.75), 0 0 28px color-mix(in srgb, var(--accent) 22%, transparent);
            opacity: 0; transform: translateY(55px) scale(.97); filter: blur(8px);
        }
        .card.visible { animation: enter .52s cubic-bezier(.18,.86,.3,1.15) forwards; }
        .card.leaving { animation: leave .38s ease-in forwards; }
        .card.critical { border-color: var(--gold); border-left-color: var(--gold); }
        .card.failure { border-color: var(--alert); border-left-color: var(--alert); }
        .scanlines { position:absolute; inset:0; opacity:.12; pointer-events:none; background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,var(--main) 4px); mix-blend-mode:overlay; }
        .topline { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:1px solid var(--line); padding-bottom:12px; }
        .character { color:var(--dim); font-size:14px; letter-spacing:3px; text-transform:uppercase; min-height:18px; }
        .title { font-family:'Oswald',sans-serif; color:var(--main); font-size:30px; line-height:1.05; letter-spacing:2px; text-transform:uppercase; margin-top:3px; }
        .badge { border:1px solid var(--line); color:var(--accent); padding:6px 10px; font-size:12px; letter-spacing:2px; white-space:nowrap; }
        .card.critical .badge { color:var(--gold); border-color:var(--gold); }
        .card.failure .badge { color:var(--alert); border-color:var(--alert); }
        .content { display:grid; grid-template-columns:1fr auto; gap:28px; align-items:end; padding-top:16px; }
        .rolls { color:var(--dim); font-size:16px; letter-spacing:2px; word-break:break-word; }
        .chosen { color:var(--main); font-size:18px; margin-top:9px; }
        .chosen strong { color:var(--accent); font-size:28px; }
        .result-wrap { display:flex; gap:18px; align-items:flex-end; }
        .result-block { min-width:125px; text-align:right; }
        .result-label { color:var(--dim); font-size:11px; letter-spacing:2px; }
        .result { color:var(--accent); font-family:'Oswald',sans-serif; font-size:64px; font-weight:700; line-height:.9; text-shadow:0 0 20px color-mix(in srgb, var(--accent) 45%, transparent); }
        .damage .result { color:var(--alert); text-shadow:0 0 20px color-mix(in srgb, var(--alert) 45%, transparent); }
        .connection { position:fixed; right:20px; bottom:18px; color:rgba(255,255,255,.3); font-size:11px; letter-spacing:2px; opacity:0; transition:.3s; }
        .connection.show { opacity:1; }
        @keyframes enter { 0%{opacity:0;transform:translateY(55px) scale(.97);filter:blur(8px)} 55%{opacity:1;filter:blur(0)} 100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)} }
        @keyframes leave { to{opacity:0;transform:translateY(-35px) scale(.98);filter:blur(7px)} }
        @media (max-width:700px) { .card{padding:18px 20px}.title{font-size:23px}.content{grid-template-columns:1fr;gap:12px}.result-wrap{justify-content:flex-end}.result{font-size:52px} }


        /* D20 3D // animação de rolagem no OBS */
        #diceStage {
            position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
            pointer-events: none; opacity: 0; transition: opacity .18s ease;
        }
        #diceStage.visible { opacity: 1; }
        #diceCanvas { width: min(960px, 94vw); height: min(560px, 66vh); display: block; }
        .dice-stage-label {
            position: fixed; left: 50%; top: 13vh; transform: translateX(-50%); z-index: 21;
            color: var(--main); font-family: 'Oswald', sans-serif; font-size: clamp(18px, 2.2vw, 31px);
            letter-spacing: 4px; text-transform: uppercase; text-align: center; text-shadow: 0 3px 18px rgba(0,0,0,.9);
            opacity: 0; transition: opacity .18s ease;
        }
        #diceStage.visible + .dice-stage-label { opacity: 1; }
        .dice-stage-label small { display: block; margin-top: 5px; color: var(--dim); font: 12px 'Share Tech Mono', monospace; letter-spacing: 2px; }
        @media (max-width:700px) {
            #diceCanvas { width: 98vw; height: 56vh; }
            .dice-stage-label { top: 18vh; width: 92vw; }
        }
        .obs-outcome-fx { position:fixed; inset:0; z-index:40; pointer-events:none; overflow:hidden; }
        .obs-outcome-fx::before { content:''; position:absolute; inset:-18%; opacity:0; }
        .obs-outcome-fx.critical::before { background:radial-gradient(circle, rgba(255,228,88,.68), rgba(255,183,0,.15) 38%, transparent 72%); animation:obsCriticalFlash 1s ease-out forwards; }
        .obs-outcome-fx.failure::before { background:repeating-linear-gradient(90deg, transparent 0 12px, rgba(255,0,35,.24) 13px 16px); animation:obsFailureGlitch .85s steps(8,end) forwards; }
        .obs-outcome-particle { position:absolute; left:50%; top:50%; width:6px; height:25px; background:var(--gold); box-shadow:0 0 18px currentColor; transform-origin:50% 350px; animation:obsParticleBurst 1.1s cubic-bezier(.1,.72,.22,1) forwards; }
        .obs-outcome-fx.failure .obs-outcome-particle { width:26px; height:4px; background:var(--alert); color:var(--alert); animation-name:obsFailureShard; }
        body.obs-critical-pulse .card { animation:obsCardCritical 1s ease-out forwards; }
        body.obs-failure-shake .card { animation:obsCardFailure .72s steps(7,end); }
        @keyframes obsCriticalFlash { 0%{opacity:0;transform:scale(.5)} 22%{opacity:1} 100%{opacity:0;transform:scale(1.3)} }
        @keyframes obsFailureGlitch { 0%{opacity:0;transform:translateX(0)} 20%{opacity:.9;transform:translateX(-20px)} 40%{opacity:.42;transform:translateX(18px)} 60%{opacity:.8;transform:translateX(-9px)} 80%{opacity:.5;transform:translateX(7px)} 100%{opacity:0;transform:translateX(0)} }
        @keyframes obsParticleBurst { 0%{opacity:0;transform:rotate(var(--angle)) translateY(0) scale(.2)} 18%{opacity:1} 100%{opacity:0;transform:rotate(var(--angle)) translateY(-340px) scale(1.2)} }
        @keyframes obsFailureShard { 0%{opacity:0;transform:rotate(var(--angle)) translateY(0) scaleX(.2)} 20%{opacity:1} 100%{opacity:0;transform:rotate(var(--angle)) translateY(-290px) scaleX(1.8)} }
        @keyframes obsCardCritical { 0%{filter:brightness(1)} 35%{filter:brightness(1.8);box-shadow:0 0 90px rgba(255,204,51,.75)} 100%{filter:brightness(1)} }
        @keyframes obsCardFailure { 0%,100%{transform:translate(0)} 14%{transform:translate(-14px,5px)} 28%{transform:translate(13px,-5px)} 42%{transform:translate(-9px,-3px)} 57%{transform:translate(10px,4px)} 72%{transform:translate(-5px,2px)} 86%{transform:translate(5px,-2px)} }

    </style>
</head>
<body>
    <aside id="persistentHud" class="persistent-hud" aria-live="polite">
        <div class="hud-layout">
            <div id="hudPortraitFrame" class="hud-portrait-frame"><img id="hudPortrait" class="hud-portrait" alt="Retrato do personagem"></div>
            <div class="hud-info">
                <div class="hud-header"><div id="hudCharacter" class="hud-character">DESCONHECIDO</div><div id="hudAfi" class="hud-afi">AFI 1</div></div>
                <div class="hud-stat vd"><span class="hud-stat-label">VD</span><div class="hud-track"><div id="hudVdFill" class="hud-fill"></div></div><span id="hudVdValue" class="hud-value">0 / 0</span></div>
                <div class="hud-stat san"><span class="hud-stat-label">SAN</span><div class="hud-track"><div id="hudSanFill" class="hud-fill"></div></div><span id="hudSanValue" class="hud-value">0 / 0</span></div>
                <div class="hud-stat pe"><span class="hud-stat-label">PE</span><div class="hud-track"><div id="hudPeFill" class="hud-fill"></div></div><span id="hudPeValue" class="hud-value">0 / 0</span></div>
            </div>
        </div>
        <div id="hudConditions" class="hud-conditions"></div>
    </aside>

    <div id="diceStage" aria-hidden="true"><canvas id="diceCanvas" width="960" height="560"></canvas></div>
    <div id="diceStageLabel" class="dice-stage-label"></div>
    <main id="stage" aria-live="polite"></main>
    <div id="connection" class="connection">AGUARDANDO SINAL...</div>
    <script>
        (() => {
            'use strict';
            const params = new URLSearchParams(location.search);
            const OVERLAY_VERSION = '2026.07.27.5-dice-controls';
            const OBS_PROTOCOL_VERSION = 3;
            const MAX_QUEUE_SIZE = 20;
            const channel = String(params.get('channel') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 80);
            const accessKey = String(params.get('key') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 80);
            const defaultDuration = Math.min(15000, Math.max(2000, (Number.parseInt(params.get('duration'), 10) || 6) * 1000));
            const stage = document.getElementById('stage');
            const connection = document.getElementById('connection');
            const persistentHud = document.getElementById('persistentHud');
            const hudCharacter = document.getElementById('hudCharacter');
            const hudAfi = document.getElementById('hudAfi');
            const hudPortrait = document.getElementById('hudPortrait');
            const hudConditions = document.getElementById('hudConditions');
            const queue = [];
            const receivedIds = new Set();
            const bootTime = Date.now();
            let active = false;
            let relaySocket = null;
            let reconnectTimer = null;
            let reconnectAttempt = 0;
            let recoveryDone = false;
            let broadcastChannel = null;
            let currentPortrait = '';
            applyLayout('standard');

            function safe(value) {
                return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
            }

            function setConnection(text, visible = true) {
                connection.textContent = text;
                connection.classList.toggle('show', visible);
                if (visible) window.setTimeout(() => connection.classList.remove('show'), 2500);
            }

            function applyTheme(theme) {
                Array.from(document.body.classList).forEach(className => {
                    if (className.startsWith('theme-')) document.body.classList.remove(className);
                });
                const allowed = new Set(['architect','light','ambar','ordem','contencao','neon','combat']);
                if (allowed.has(theme)) document.body.classList.add(`theme-${theme}`);
            }

            function applyLayout(layout) {
                Array.from(document.body.classList).forEach(className => {
                    if (className.startsWith('layout-')) document.body.classList.remove(className);
                });
                const allowed = new Set(['standard','compact','lowerthird','sidebar','topbar','mirrored']);
                const selected = allowed.has(layout) ? layout : 'standard';
                if (selected !== 'standard') document.body.classList.add(`layout-${selected}`);
            }

            function validPortrait(value) {
                return typeof value === 'string' && /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(value) && value.length <= 4000;
            }

            function normalize(payload) {
                if (!payload || typeof payload !== 'object') return null;
                if (payload.channel && String(payload.channel) !== channel) return null;
                if (accessKey && String(payload.accessKey || '') !== accessKey) return null;
                if (String(payload.event || '') === 'ack') return null;
                const protocol = Number(payload.protocol) || 2;
                if (protocol > OBS_PROTOCOL_VERSION) setConnection(`VERSÃO DO OVERLAY DESATUALIZADA // PROTOCOLO ${protocol}`, true);
                const timestamp = Number(payload.timestamp) || Date.now();
                const eventType = String(payload.event || 'roll');
                if (!['hud', 'portrait'].includes(eventType) && timestamp < bootTime - 2500) return null;
                const id = String(payload.id || `${timestamp}-${Math.random()}`);
                if (receivedIds.has(id)) return null;
                receivedIds.add(id);
                if (receivedIds.size > 150) receivedIds.delete(receivedIds.values().next().value);
                let hud = null;
                if (payload.hud && typeof payload.hud === 'object') {
                    hud = { ...payload.hud };
                    if (Object.prototype.hasOwnProperty.call(payload.hud, 'portrait')) {
                        hud.portrait = validPortrait(payload.hud.portrait) ? payload.hud.portrait : '';
                    } else delete hud.portrait;
                }
                return {
                    id, protocol, appVersion: String(payload.appVersion || ''), timestamp,
                    duration: Math.min(15000, Math.max(2000, Number(payload.duration) || defaultDuration)),
                    event: eventType, character: String(payload.character || '').slice(0, 80),
                    title: String(payload.title || 'ROLAGEM').slice(0, 120),
                    subtitle: String(payload.subtitle || 'DARK DASHBOARD').slice(0, 100),
                    message: String(payload.message || '').slice(0, 900),
                    rolls: Array.isArray(payload.rolls) ? payload.rolls.slice(0, 30).map(Number) : [],

            /* =========================================================
               D20 3D ANIMADO // sem dependências externas
               ========================================================= */
            const diceStage = document.getElementById('diceStage');
            const diceCanvas = document.getElementById('diceCanvas');
            const diceStageLabel = document.getElementById('diceStageLabel');
            const diceContext = diceCanvas.getContext('2d');
            const D20_GEOMETRY = (() => {
                const phi = (1 + Math.sqrt(5)) / 2;
                const rawVertices = [
                    [-1, phi, 0], [1, phi, 0], [-1, -phi, 0], [1, -phi, 0],
                    [0, -1, phi], [0, 1, phi], [0, -1, -phi], [0, 1, -phi],
                    [phi, 0, -1], [phi, 0, 1], [-phi, 0, -1], [-phi, 0, 1]
                ];
                const vertices = rawVertices.map(vertex => {
                    const length = Math.hypot(vertex[0], vertex[1], vertex[2]) || 1;
                    return [vertex[0] / length, vertex[1] / length, vertex[2] / length];
                });
                const faces = [
                    [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
                    [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
                    [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
                    [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
                ];
                return { vertices, faces };
            })();
            const D20_FACE_NORMALS = D20_GEOMETRY.faces.map(face => {
                const centroid = face.reduce((accumulator, vertexIndex) => {
                    const vertex = D20_GEOMETRY.vertices[vertexIndex];
                    return [accumulator[0] + vertex[0], accumulator[1] + vertex[1], accumulator[2] + vertex[2]];
                }, [0, 0, 0]).map(value => value / 3);
                return normalizeVector(centroid);
            });
            const d20OrientationCache = new Map();

            function normalizeVector(vector) {
                const length = Math.hypot(vector[0], vector[1], vector[2]) || 1;
                return [vector[0] / length, vector[1] / length, vector[2] / length];
            }

            function rotateVertex(vertex, rx, ry, rz) {
                let [x, y, z] = vertex;
                let cosine = Math.cos(rx), sine = Math.sin(rx);
                [y, z] = [y * cosine - z * sine, y * sine + z * cosine];
                cosine = Math.cos(ry); sine = Math.sin(ry);
                [x, z] = [x * cosine + z * sine, -x * sine + z * cosine];
                cosine = Math.cos(rz); sine = Math.sin(rz);
                [x, y] = [x * cosine - y * sine, x * sine + y * cosine];
                return [x, y, z];
            }

            function lerpAngle(current, target, amount) {
                let difference = (target - current + Math.PI) % (Math.PI * 2);
                if (difference < 0) difference += Math.PI * 2;
                difference -= Math.PI;
                return current + difference * amount;
            }

            function targetOrientationForFace(faceIndex) {
                const target = Math.max(0, Math.min(19, Number(faceIndex) || 0));
                if (d20OrientationCache.has(target)) return d20OrientationCache.get(target);
                const normal = D20_FACE_NORMALS[target];
                let best = { score: -Infinity, rx: 0, ry: 0, rz: 0 };
                const evaluate = (rx, ry, rz) => {
                    const rotated = rotateVertex(normal, rx, ry, rz);
                    const score = rotated[2] * 1.6 - Math.abs(rotated[0]) * .18 - Math.abs(rotated[1]) * .18;
                    if (score > best.score) best = { score, rx, ry, rz };
                };
                for (let attempt = 0; attempt < 600; attempt += 1) {
                    evaluate(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
                }
                let step = .34;
                while (step > .018) {
                    let improved = false;
                    const previous = { ...best };
                    [-step, 0, step].forEach(dx => [-step, 0, step].forEach(dy => [-step, 0, step].forEach(dz => evaluate(previous.rx + dx, previous.ry + dy, previous.rz + dz))));
                    if (best.score > previous.score) improved = true;
                    if (!improved) step *= .55;
                }
                d20OrientationCache.set(target, best);
                return best;
            }

            function readOverlayColor(variable, fallback) {
                return getComputedStyle(document.body).getPropertyValue(variable).trim() || fallback;
            }

            function hexToRgba(value, alpha) {
                const hex = String(value || '').trim().replace('#', '');
                if (!/^[0-9a-fA-F]{3,6}$/.test(hex)) return `rgba(255,255,255,${alpha})`;
                const normalized = hex.length === 3 ? hex.split('').map(character => character + character).join('') : hex;
                const number = Number.parseInt(normalized, 16);
                return `rgba(${(number >> 16) & 255},${(number >> 8) & 255},${number & 255},${alpha})`;
            }

            function drawRoundedRect(context, x, y, width, height, radius) {
                const r = Math.min(radius, width / 2, height / 2);
                context.beginPath();
                context.moveTo(x + r, y);
                context.lineTo(x + width - r, y);
                context.quadraticCurveTo(x + width, y, x + width, y + r);
                context.lineTo(x + width, y + height - r);
                context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
                context.lineTo(x + r, y + height);
                context.quadraticCurveTo(x, y + height, x, y + height - r);
                context.lineTo(x, y + r);
                context.quadraticCurveTo(x, y, x + r, y);
                context.closePath();
            }

            function drawTray(context, width, height) {
                context.clearRect(0, 0, width, height);
                const gradient = context.createRadialGradient(width / 2, height / 2, 30, width / 2, height / 2, width * .55);
                gradient.addColorStop(0, 'rgba(0,0,0,.28)');
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                context.fillStyle = gradient;
                context.fillRect(0, 0, width, height);
                context.save();
                context.strokeStyle = 'rgba(255,255,255,.12)';
                context.lineWidth = 2;
                drawRoundedRect(context, 35, 35, width - 70, height - 70, 28);
                context.stroke();
                context.restore();
            }

            function drawD20(context, actor, event) {
                const rotatedVertices = D20_GEOMETRY.vertices.map(vertex => rotateVertex(vertex, actor.rx, actor.ry, actor.rz));
                const projectionDistance = 4.8;
                const projected = rotatedVertices.map(vertex => {
                    const perspective = projectionDistance / (projectionDistance - vertex[2]);
                    return { x: vertex[0] * actor.radius * perspective, y: vertex[1] * actor.radius * perspective };
                });
                const accent = event.critical ? readOverlayColor('--gold', '#ffcc33') : event.failure ? readOverlayColor('--alert', '#ff2929') : readOverlayColor('--accent', '#ffffff');
                const main = readOverlayColor('--main', '#e8e8e8');
                const line = readOverlayColor('--line', 'rgba(255,255,255,.2)');
                const light = normalizeVector([-.65, -.8, 1]);
                const faceData = D20_GEOMETRY.faces.map((face, index) => {
                    const a = rotatedVertices[face[0]], b = rotatedVertices[face[1]], c = rotatedVertices[face[2]];
                    const ab = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
                    const ac = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
                    const normal = normalizeVector([ab[1]*ac[2]-ab[2]*ac[1], ab[2]*ac[0]-ab[0]*ac[2], ab[0]*ac[1]-ab[1]*ac[0]]);
                    const center = [(a[0]+b[0]+c[0])/3, (a[1]+b[1]+c[1])/3, (a[2]+b[2]+c[2])/3];
                    return { face, index, normal, center, depth:center[2], light:Math.max(0, normal[0]*light[0]+normal[1]*light[1]+normal[2]*light[2]) };
                }).sort((left, right) => left.depth - right.depth);

                context.save();
                context.translate(actor.x, actor.y + actor.offsetY);
                context.fillStyle = actor.chosen ? hexToRgba(accent, .25) : 'rgba(0,0,0,.34)';
                context.beginPath();
                context.ellipse(0, actor.radius * 1.12, actor.radius * .88, actor.radius * .23, 0, 0, Math.PI * 2);
                context.fill();
                if (actor.chosen && actor.revealed) { context.shadowBlur = 30; context.shadowColor = accent; }

                faceData.forEach(faceInfo => {
                    const points = faceInfo.face.map(vertexIndex => projected[vertexIndex]);
                    const shade = .18 + faceInfo.light * .34;
                    const isResultFace = faceInfo.index === actor.targetFace && actor.revealed;
                    context.beginPath();
                    context.moveTo(points[0].x, points[0].y);
                    context.lineTo(points[1].x, points[1].y);
                    context.lineTo(points[2].x, points[2].y);
                    context.closePath();
                    context.fillStyle = isResultFace && actor.chosen ? hexToRgba(accent, .94) : `rgba(${Math.round(12 + 62*shade)},${Math.round(12 + 68*shade)},${Math.round(16 + 76*shade)},.96)`;
                    context.fill();
                    context.strokeStyle = isResultFace ? accent : line;
                    context.lineWidth = isResultFace ? 2 : 1;
                    context.stroke();
                    if (faceInfo.normal[2] > .04) {
                        const perspective = projectionDistance / (projectionDistance - faceInfo.center[2]);
                        const centerX = faceInfo.center[0] * actor.radius * perspective;
                        const centerY = faceInfo.center[1] * actor.radius * perspective;
                        context.save();
                        context.translate(centerX, centerY);
                        context.fillStyle = isResultFace && actor.chosen ? '#050505' : main;
                        context.font = `700 ${Math.max(10, actor.radius * .29)}px Oswald, Arial, sans-serif`;
                        context.textAlign = 'center';
                        context.textBaseline = 'middle';
                        context.fillText(String(faceInfo.index + 1), 0, 0);
                        context.restore();
                    }
                });
                context.restore();
            }


            let diceAudioContext = null;
            function getDiceAudioContext() {
                const Constructor = window.AudioContext || window.webkitAudioContext;
                if (!Constructor) return null;
                if (!diceAudioContext) diceAudioContext = new Constructor();
                if (diceAudioContext.state === 'suspended') diceAudioContext.resume().catch(() => {});
                return diceAudioContext;
            }
            function playDiceImpact(event, strength = .7, outcome = '') {
                if (event?.diceSound === false) return;
                const context = getDiceAudioContext();
                if (!context) return;
                const now = context.currentTime;
                const duration = .08 + Math.max(0, Math.min(1, strength)) * .06;
                const buffer = context.createBuffer(1, Math.max(1, Math.floor(context.sampleRate * duration)), context.sampleRate);
                const samples = buffer.getChannelData(0);
                for (let index = 0; index < samples.length; index++) samples[index] = (Math.random() * 2 - 1) * Math.pow(1 - index / samples.length, 3.3);
                const source = context.createBufferSource();
                const filter = context.createBiquadFilter();
                const gain = context.createGain();
                source.buffer = buffer;
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(outcome === 'critical' ? 1500 : outcome === 'failure' ? 520 : 900, now);
                gain.gain.setValueAtTime(.0001, now);
                gain.gain.exponentialRampToValueAtTime(.06 * Math.max(.3, strength), now + .006);
                gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
                source.connect(filter); filter.connect(gain); gain.connect(context.destination);
                source.start(now); source.stop(now + duration + .03);
                const oscillator = context.createOscillator();
                const oscillatorGain = context.createGain();
                oscillator.type = outcome === 'failure' ? 'sawtooth' : 'triangle';
                oscillator.frequency.setValueAtTime(outcome === 'critical' ? 120 : outcome === 'failure' ? 45 : 70, now);
                oscillator.frequency.exponentialRampToValueAtTime(30, now + duration);
                oscillatorGain.gain.setValueAtTime(.022 * Math.max(.3, strength), now);
                oscillatorGain.gain.exponentialRampToValueAtTime(.0001, now + duration);
                oscillator.connect(oscillatorGain); oscillatorGain.connect(context.destination);
                oscillator.start(now); oscillator.stop(now + duration + .03);
            }
            function diceAnimationDuration(event, count) {
                if (window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches) return 280;
                if (event.diceSpeed === 'fast') return Math.min(1050, 500 + count * 65);
                if (event.diceSpeed === 'cinematic') return Math.min(4300, 2250 + count * 230);
                return Math.min(2300, 1300 + count * 110);
            }
            function triggerOutcomeEffect(event) {
                if (event.diceFx === false || (!event.critical && !event.failure)) return;
                const type = event.critical ? 'critical' : 'failure';
                const effect = document.createElement('div');
                effect.className = `obs-outcome-fx ${type}`;
                const count = type === 'critical' ? 34 : 24;
                for (let index = 0; index < count; index++) {
                    const particle = document.createElement('span');
                    particle.className = 'obs-outcome-particle';
                    particle.style.setProperty('--angle', `${index * 360 / count + Math.random() * 9}deg`);
                    particle.style.animationDelay = `${Math.random() * .14}s`;
                    effect.appendChild(particle);
                }
                document.body.appendChild(effect);
                const bodyClass = type === 'critical' ? 'obs-critical-pulse' : 'obs-failure-shake';
                document.body.classList.add(bodyClass);
                playDiceImpact(event, 1, type);
                window.setTimeout(() => { effect.remove(); document.body.classList.remove(bodyClass); }, 1250);
            }

            function animateDice(event) {
                return new Promise(resolve => {
                    if (!diceContext || !event.rolls.length || event.dice3d === false) { resolve(); return; }
                    const values = event.rolls.slice(0, 8).map(value => Math.max(1, Math.min(20, Number(value) || 1)));
                    const chosenIndex = Math.max(0, values.indexOf(Math.max(1, Math.min(20, Number(event.chosen) || values[0]))));
                    const width = diceCanvas.width;
                    const height = diceCanvas.height;
                    const rows = values.length > 4 ? 2 : 1;
                    const columns = rows === 1 ? values.length : Math.ceil(values.length / 2);
                    const actors = values.map((value, index) => {
                        const row = rows === 1 ? 0 : Math.floor(index / columns);
                        const column = rows === 1 ? index : index % columns;
                        const cellWidth = width / columns;
                        const cellHeight = height / rows;
                        return {
                            x: cellWidth * (column + .5), y: cellHeight * (row + .53),
                            radius: Math.min(78, Math.max(45, Math.min(cellWidth, cellHeight) * .27)),
                            rx: Math.random()*Math.PI*2, ry: Math.random()*Math.PI*2, rz: Math.random()*Math.PI*2,
                            spinX:(.25+Math.random()*.34)*(Math.random()>.5?1:-1), spinY:(.28+Math.random()*.4)*(Math.random()>.5?1:-1), spinZ:(.18+Math.random()*.3)*(Math.random()>.5?1:-1),
                            target:targetOrientationForFace(value-1), targetFace:value-1, chosen:index===chosenIndex,
                            phase:Math.random()*Math.PI*2, offsetY:-15, revealed:false
                        };
                    });
                    diceStageLabel.innerHTML = `${safe(event.title)}<small>${safe(event.subtitle || 'ROLAGEM TÁTICA')}</small>`;
                    diceStage.classList.add('visible');
                    const duration = diceAnimationDuration(event, values.length);
                    const impactThresholds = [.12, .3, .48, .67, .82];
                    let impactIndex = 0;
                    let started = null;
                    function frame(timestamp) {
                        if (started === null) started = timestamp;
                        const elapsed = timestamp - started;
                        const progress = Math.min(1, elapsed / duration);
                        while (impactIndex < impactThresholds.length && progress >= impactThresholds[impactIndex]) {
                            playDiceImpact(event, .4 + impactIndex * .1);
                            impactIndex += 1;
                        }
                        drawTray(diceContext, width, height);
                        actors.forEach(actor => {
                            if (progress < .72) {
                                const damp = 1 - progress/.72;
                                actor.rx += actor.spinX*(1.35+damp*.7);
                                actor.ry += actor.spinY*(1.35+damp*.7);
                                actor.rz += actor.spinZ*(1.15+damp*.55);
                                actor.offsetY = -Math.abs(Math.sin(elapsed/145+actor.phase))*35*damp - damp*12;
                            } else {
                                const settle = (progress-.72)/.28;
                                actor.rx = lerpAngle(actor.rx, actor.target.rx, .14+settle*.17);
                                actor.ry = lerpAngle(actor.ry, actor.target.ry, .14+settle*.17);
                                actor.rz = lerpAngle(actor.rz, actor.target.rz, .16+settle*.19);
                                actor.offsetY *= .68;
                                actor.revealed = settle > .48;
                            }
                            drawD20(diceContext, actor, event);
                        });
                        if (progress < 1) requestAnimationFrame(frame);
                        else window.setTimeout(() => {
                            diceStage.classList.remove('visible');
                            window.setTimeout(() => { diceContext.clearRect(0,0,width,height); diceStageLabel.textContent=''; resolve(); }, 190);
                        }, 380);
                    }
                    requestAnimationFrame(frame);
                });
            }

            function enqueue(payload, transport = 'local') {
                if (payload?.remoteOnly && transport !== 'remote') return;
                const event = normalize(payload);
                if (!event) return;
                if (event.event === 'portrait') { updatePortrait(event); return; }
                if (event.event === 'hud') { updateHud(event); return; }
                if (queue.length >= MAX_QUEUE_SIZE) queue.shift();
                queue.push(event);
                if (!active) showNext();
            }


            function showResultCard(event) {
                const status = event.critical ? 'CRÍTICO' : event.failure ? 'FALHA CRÍTICA' : event.event === 'test' ? 'TESTE' : 'RESULTADO';
                const bonus = event.bonus ? ` ${event.bonus > 0 ? '+' : ''}${event.bonus}` : '';
                const rolls = event.rolls.length ? `[ ${event.rolls.join(' | ')} ]` : '[ -- ]';
                const card = document.createElement('section');
                card.className = `card${event.critical ? ' critical' : ''}${event.failure ? ' failure' : ''}`;
                card.innerHTML = `
                    <div class="scanlines"></div>
                    <div class="topline">
                        <div><div class="character">${safe(event.character)}</div><div class="title">${safe(event.title)}</div></div>
                        <div class="badge">${safe(status)}</div>
                    </div>
                    <div class="content">
                        <div><div class="rolls">DADOS: ${safe(rolls)}</div><div class="chosen">ESCOLHIDO: <strong>${event.chosen}</strong>${safe(bonus)}</div></div>
                        <div class="result-wrap">
                            ${event.damage !== null ? `<div class="result-block damage"><div class="result-label">DANO</div><div class="result">${event.damage}</div></div>` : ''}
                            <div class="result-block"><div class="result-label">${safe(event.subtitle)}</div><div class="result">${event.total}</div></div>
                        </div>
                    </div>`;
                stage.replaceChildren(card);
                requestAnimationFrame(() => { card.classList.add('visible'); triggerOutcomeEffect(event); });
                if (event.event === 'test') sendTestAck(event);
                window.setTimeout(() => {
                    card.classList.remove('visible');
                    card.classList.add('leaving');
                    window.setTimeout(() => { card.remove(); showNext(); }, 420);
                }, event.duration);
            }

            async function showNext() {
                if (!queue.length) { active = false; return; }
                active = true;
                const event = queue.shift();
                applyTheme(event.theme);
                applyLayout(event.layout);
                if (event.event === 'banner') {
                    const card = document.createElement('section');
                    card.className = 'card';
                    card.innerHTML = `<div class="scanlines"></div><div class="topline"><div><div class="character">${safe(event.character || 'DARK 1.7.1')}</div><div class="title">${safe(event.title)}</div></div><div class="badge">${safe(event.subtitle || 'AVISO')}</div></div><div class="content"><div class="rolls" style="font-size:1.25rem;line-height:1.45">${safe(event.message || '')}</div></div>`;
                    stage.replaceChildren(card);
                    requestAnimationFrame(() => card.classList.add('visible'));
                    window.setTimeout(() => {
                        card.classList.remove('visible'); card.classList.add('leaving');
                        window.setTimeout(() => { card.remove(); showNext(); }, 420);
                    }, event.duration);
                    return;
                }
                await animateDice(event);

            }

            function extractRelayPayload(envelope) {
                try {
                    const parsed = typeof envelope === 'string' ? JSON.parse(envelope) : envelope;
                    if (!parsed || typeof parsed !== 'object') return null;
                    if (parsed.event === 'open' || parsed.event === 'keepalive') return null;
                    if (parsed.event !== 'message') return null;
                    const payload = JSON.parse(parsed.message);
                    if (payload?.event === 'ack') return null;
                    return payload;
                } catch (error) { console.warn('Evento remoto inválido.', error); return null; }
            }

            function parseRelayEnvelope(envelope) {
                const payload = extractRelayPayload(envelope);
                if (payload) enqueue(payload, 'remote');
            }

            function processRecoveryBatch(text) {
                const payloads = text.split(/\r?\n/).filter(Boolean).map(extractRelayPayload).filter(Boolean);
                let latestHud = null;
                let latestPortrait = null;
                payloads.forEach(payload => {
                    const type = String(payload.event || '');
                    if (type === 'hud' && (!latestHud || Number(payload.timestamp || 0) > Number(latestHud.timestamp || 0))) latestHud = payload;
                    if (type === 'portrait' && (!latestPortrait || Number(payload.timestamp || 0) > Number(latestPortrait.timestamp || 0))) latestPortrait = payload;
                });
                if (latestPortrait) enqueue(latestPortrait, 'remote');
                if (latestHud) enqueue(latestHud, 'remote');
            }

            async function recoverPersistentStateOnce() {
                if (recoveryDone) return;
                recoveryDone = true;
                const controller = new AbortController();
                const timeoutId = window.setTimeout(() => controller.abort(), 9000);
                try {
                    const url = `https://ntfy.sh/${encodeURIComponent(channel)}/json?poll=1&since=12h&_=${Date.now()}`;
                    const response = await fetch(url, { mode: 'cors', cache: 'no-store', credentials: 'omit', signal: controller.signal });
                    if (!response.ok) {
                        if (response.status === 429) setConnection('RELAY TEMPORARIAMENTE LIMITADO // HUD AO VIVO CONTINUA', true);
                        throw new Error(`HTTP ${response.status}`);
                    }
                    processRecoveryBatch(await response.text());
                } catch (error) {
                    console.warn('Recuperação única do HUD indisponível.', error);
                } finally { window.clearTimeout(timeoutId); }
            }

            function closeRelaySocket() {
                clearTimeout(reconnectTimer); reconnectTimer = null;
                if (!relaySocket) return;
                try {
                    relaySocket.onopen = relaySocket.onmessage = relaySocket.onerror = relaySocket.onclose = null;
                    relaySocket.close();
                } catch (error) {}
                relaySocket = null;
            }

            function scheduleReconnect() {
                if (navigator.onLine === false || reconnectTimer) return;
                const base = Math.min(60000, 4000 * (2 ** Math.min(reconnectAttempt, 4)));
                const delay = base + Math.floor(Math.random() * 1200);
                reconnectAttempt += 1;
                setConnection(`RECONECTANDO EM ${Math.ceil(delay / 1000)}s`, true);
                reconnectTimer = window.setTimeout(() => {
                    reconnectTimer = null;
                    startRelaySocket();
                }, delay);
            }

            function startRelaySocket() {
                if (navigator.onLine === false) return;
                closeRelaySocket();
                setConnection('CONECTANDO OVERLAY...', true);
                try {
                    const socket = new WebSocket(`wss://ntfy.sh/${encodeURIComponent(channel)}/ws`);
                    relaySocket = socket;
                    socket.onopen = () => {
                        if (relaySocket !== socket) return;
                        reconnectAttempt = 0;
                        setConnection('OVERLAY CONECTADO // SESSÃO SEGURA', true);
                        recoverPersistentStateOnce();
                    };
                    socket.onmessage = event => parseRelayEnvelope(event.data);
                    socket.onerror = () => { if (relaySocket === socket) socket.close(); };
                    socket.onclose = () => {
                        if (relaySocket !== socket) return;
                        relaySocket = null;
                        scheduleReconnect();
                    };
                } catch (error) {
                    console.warn('WebSocket do relay indisponível.', error);
                    relaySocket = null;
                    scheduleReconnect();
                }
            }

            if (!accessKey) setConnection('CANAL LEGADO SEM CHAVE — RECOPIE A URL', true);
            if (!channel || channel.length < 16) {
                setConnection('CANAL INVÁLIDO — COPIE A URL PELO DASHBOARD', true);
                return;
            }

            if ('BroadcastChannel' in window) {
                try {
                    broadcastChannel = new BroadcastChannel(`dark-obs-${channel}`);
                    broadcastChannel.addEventListener('message', event => enqueue(event.data, 'local'));
                } catch (error) { console.warn(error); }
            }
            window.addEventListener('storage', event => {
                if (event.key !== 'DarkObsLastEvent' || !event.newValue) return;
                try { enqueue(JSON.parse(event.newValue), 'local'); } catch (error) { console.warn(error); }
            });
            window.addEventListener('online', () => { reconnectAttempt = 0; startRelaySocket(); });
            window.addEventListener('offline', () => {
                closeRelaySocket();
                setConnection('SEM INTERNET — ÚLTIMO HUD PRESERVADO', true);
            });
            window.addEventListener('beforeunload', closeRelaySocket);
            startRelaySocket();
        })();
    </script>
</body>
</html>
